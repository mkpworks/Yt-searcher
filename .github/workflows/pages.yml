# Deploys the static site to GitHub Pages.
# Settings > Pages > Source must be "GitHub Actions".
# A push to main publishes the assembled site.
# Upload and deploy are separate jobs so the github-pages artifact is listed before deploy-pages reads it.

name: Deploy static site to Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collection data
        run: node scripts/validate-data.js
      - name: Check catalog behavior
        run: node scripts/check-catalog.js

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate collection data
        run: node scripts/validate-data.js
      # configure-pages asks the Pages API for the site. That 404s until
      # Settings > Pages > Source is GitHub Actions, which would fail every
      # pull request. Pull requests still build and upload the artifact.
      # Deploy stays on push to main, in its own job.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Build site
        run: node scripts/build-site.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
